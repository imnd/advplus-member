<div class="modal fade" id="modal_add_referee" #addRefereeModalRef tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered mw-650px">
    <div class="modal-content rounded">
      <div class="modal-header pb-0 border-0 justify-content-end">
        <div class="btn btn-sm btn-icon btn-btn-active-color-portal" data-bs-dismiss="modal">
          <span class="svg-icon svg-icon-1">
            <app-inline-svg src="/media/icons/duotune/arrows/arr061.svg" />
          </span>
        </div>
      </div>

      <div class="modal-body scroll-y px-10 px-lg-15 pt-0 pb-15">
        <form [formGroup]="form" (ngSubmit)="onSubmitAddReferee()" id="modal_add_referee_form" class="form">
          <div class="mb-13 text-center">
            <h1 class="mb-3">Add referee</h1>
          </div>

          <div class="fv-row mb-10">
            <label class="form-label fw-bolder text-gray-900 fs-6">Referral code</label>
            <input [value]="code" disabled class="form-control form-control-solid" />
          </div>

          <div class="fv-row mb-10">
            <label class="form-label fw-bolder text-gray-900 fs-6 required">Referee name</label>
            <input
              formControlName="name"
              class="form-control form-control-solid"
              type="text"
              autocomplete="off"
            />
            <app-error-message name="email" [form]="form" />
          </div>

          <div class="fv-row mb-10">
            <label class="form-label fw-bolder text-gray-900 fs-6 required">Email</label>
            <input
              formControlName="email"
              class="form-control form-control-solid"
              type="email"
              autocomplete="off"
            />
            <app-error-message name="email" [form]="form" />
          </div>
          <div class="fv-row mb-10">
            <label class="form-label fw-bolder text-gray-900 fs-6 required">Mobile number</label>
            <input
              formControlName="mobile"
              class="form-control form-control-solid"
              type="tel"
              autocomplete="off"
            />
            <app-error-message name="mobile" [form]="form" />
          </div>
          <div class="text-center">
            <button type="button" class="btn btn-white me-3" (click)="cancel()">Cancel</button>
            <app-process-button [loading]="loading" />
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
