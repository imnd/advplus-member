<div class="modal fade" id="choose_reward_modal" #chooseRewardModalRef tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered mw-650px">
    <div class="modal-content rounded">
      <div class="modal-header pb-0 border-0 justify-content-end">
        <div class="btn btn-sm btn-icon btn-btn-active-color-portal" data-bs-dismiss="modal">
          <span class="svg-icon svg-icon-1">
            <app-inline-svg src="/media/icons/duotune/arrows/arr061.svg" />
          </span>
        </div>
      </div>
      <div class="modal-body scroll-y px-10 px-lg-15 pt-0 pb-15">
        <form [formGroup]="form" (ngSubmit)="onSubmitChooseReward()" class="form">
          <div class="mb-13 text-center">
            <h1 class="mb-3">Choose reward</h1>
          </div>
          <app-skeleton [animated]="true" [loading]="isRewardOptionsLoading">
            <ng-template #template>
              <div class="fv-row mb-10">
                <app-skeleton-item variant="text" class="w-100 form-select form-select-solid" />
              </div>
            </ng-template>
            <ng-template #content>
              <div class="fv-row mb-10">
                <select name="reward" class="form-select form-select-solid w-100">
                  <option value="" disabled>Choose Reward</option>
                  @for (reward of rewardOptions | keyvalue; track reward.key) {
                    <option
                      [value]="$index"
                      [disabled]="!additionalClubAvailable && reward.key === 'additional_club'"
                    >
                      {{ reward.value }}
                      @if (reward.key === 'additional_club') {
                        @if (!additionalClubAvailable) {
                          (available from 3 joined referrals)
                        } @else {
                          (3 joined referrals will be used)
                        }
                      }
                    </option>
                  }
                </select>
                <app-error-message name="reward" [form]="form" />
              </div>
              @if (showClubs()) {
                <app-skeleton [animated]="true" [loading]="isClubsLoading">
                  <ng-template #template>
                    <div class="fv-row mb-10">
                      <app-skeleton-item
                        variant="text"
                        class="w-100 form-select form-select-solid"
                      />
                    </div>
                  </ng-template>
                  <ng-template #content>
                    <div class="fv-row mb-10">
                      <select name="club" class="form-control form-control-solid">
                        @if (clubs) {
                          <option value="" disabled>
                            {{ clubs ? "Choose Club" : "You already have all available clubs" }}
                          </option>
                        }
                        @for (club of clubs; track club.uuid) {
                          <option [value]="club.uuid">
                            {{ club.title }}
                          </option>
                        }
                      </select>
                      <div class="fv-plugins-message-container">
                        <div class="fv-help-block">
                          <app-error-message name="club" [form]="form" />
                        </div>
                      </div>
                    </div>
                  </ng-template>
                </app-skeleton>
              }
            </ng-template>
          </app-skeleton>
          <div class="text-center">
            <button type="reset" class="btn btn-white me-3" (click)="cancel()">Cancel</button>
            <app-process-button [loading]="loading || isRewardOptionsLoading" />
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
