<div class="modal fade" id="modal_change_password" #changePasswordModal tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered mw-650px">
    <div class="modal-content rounded">
      <div class="modal-header pb-0 border-0 justify-content-end">
        <div class="btn btn-sm btn-icon btn-btn-active-color-portal" data-bs-dismiss="modal">
            <span class="svg-icon svg-icon-1">
              <app-inline-svg src="/media/icons/duotune/arrows/arr061.svg" />
            </span>
        </div>
      </div>

      <div class="modal-body scroll-y px-10 px-lg-15 pt-0 pb-15">
        <form
          [formGroup]="form"
          (ngSubmit)="onSubmitChangePassword()"
          id="modal_change_password_form"
          class="form"
        >
          <div class="mb-13 text-center">
            <h1 class="mb-3">Change Password</h1>
          </div>

          <app-field
            [form]="form"
            type="password"
            name="current_password"
            autocomplete="off"
            label="Current Password"
          />

          <app-field
            [form]="form"
            type="password"
            name="password"
            autocomplete="off"
            label="New Password"
          >
            <div class="d-flex align-items-center mb-3" data-kt-password-meter-control="highlight">
              <div class="flex-grow-1 bg-secondary bg-active-success rounded h-5px me-2"></div>
              <div class="flex-grow-1 bg-secondary bg-active-success rounded h-5px me-2"></div>
              <div class="flex-grow-1 bg-secondary bg-active-success rounded h-5px me-2"></div>
              <div class="flex-grow-1 bg-secondary bg-active-success rounded h-5px"></div>
            </div>
          </app-field>

          <app-field
            [form]="form"
            type="password"
            name="confirmation"
            autocomplete="off"
            label="Confirm new Password"
          />

          <div class="text-center">
            <button type="reset" class="btn btn-white me-3" (click)="cancel()">Cancel</button>
            <app-process-button [loading]="loading" />
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
