<div class="w-lg-500px bg-white rounded shadow-sm p-10 p-lg-15 mx-auto">
  <form class="form w-100" [formGroup]="form" (ngSubmit)="onSubmitLogin()">
    <div class="text-center mb-10">
      <h1 class="text-dark mb-3">Sign In</h1>
    </div>
    @if (authFailed) {
      <div class="alert alert-danger bg-light-danger p-3 text-center">
        Invalid credentials, please try again
      </div>
    }
    <app-field [form]="form" name="email" label="Email" />
    <div class="fv-row mb-10" data-kt-password-meter="true">
      <div class="d-flex flex-stack mb-2">
        <label class="form-label fw-bolder text-dark fs-6 mb-0">Password</label>
        <a routerLink="/forgot-password" class="link-portal fs-6 fw-bolder"> Forgot Password ? </a>
      </div>
      <app-field [form]="form" name="password" type="password" autocomplete="off">
        <span
          class="btn btn-sm btn-icon position-absolute translate-middle top-50 end-0 me-n2"
          data-kt-password-meter-control="visibility"
        >
          <i class="bi bi-eye-slash fs-2"></i>
          <i class="bi bi-eye fs-2 d-none"></i>
        </span>
      </app-field>
    </div>
    <div class="text-center">
      <app-process-button [loading]="loading" loadingText="Continue" />
    </div>
  </form>
</div>
